<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PulseTag — Link ABHA ID</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="state.js"></script>
  <script src="i18n.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #0f172a;
      --primary-dark: #020617;
      --accent-teal: #14b8a6;
      --teal-bg: #e6f7f5;
      --teal-text: #0f766e;
      --hero-bg: #e8f4f8;
      --card-mint: #dcfce7;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --white: #ffffff;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --success: #15803d;
      --success-bg: #f0fdf4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--hero-bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* Top Announcement Bar */
    .announcement-bar {
      background: var(--teal-bg);
      color: var(--teal-text);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .announcement-badge {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--accent-teal);
      border-radius: 50%;
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .brand-title {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    /* Page Container */
    .page {
      width: 100%;
      max-width: 640px;
      margin: 20px auto 40px;
      padding: 0 24px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: var(--white);
      border-radius: 28px;
      padding: 48px 40px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    .step-pill {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 9999px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      margin: 0 0 10px;
      font-size: clamp(26px, 4.5vw, 34px);
      font-weight: 800;
      line-height: 1.25;
      color: #0f172a;
      letter-spacing: -0.7px;
    }

    .subtitle {
      max-width: 480px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .form {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }

    input {
      width: 100%;
      min-height: 54px;
      padding: 0 18px;
      border: 2px solid var(--border);
      border-radius: 16px;
      outline: none;
      background: #ffffff;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #0f172a;
      box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.08);
    }

    input:disabled {
      background: #f1f5f9;
      cursor: not-allowed;
    }

    input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      font-weight: 500;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      border: 1px solid #fecaca;
      background: var(--error-bg);
      color: var(--error);
    }

    .message.success {
      border: 1px solid #bbf7d0;
      background: var(--success-bg);
      color: var(--success);
    }

    .button {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .button-primary {
      border: 0;
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
    }

    .button-primary:hover:not(:disabled) {
      background: #1e293b;
      transform: translateY(-2px);
    }

    .button-secondary {
      margin-top: 12px;
      border: 2px solid var(--border);
      background: #ffffff;
      color: #0f172a;
    }

    .button-secondary:hover:not(:disabled) {
      border-color: #94a3b8;
      background: #f8fafc;
      transform: translateY(-2px);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .card {
        padding: 36px 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <!-- Top Announcement Bar -->
  <div class="announcement-bar">
    <span class="announcement-badge"></span>
    <span>Your health data, always accessible — National ABDM Integration</span>
  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <span class="brand-title">PulseTag</span>
    </a>
  </nav>

  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="header">
        <span class="step-pill">Account Link</span>

        <h1 id="page-title" data-i18n="abhaLink.title">
          Link your ABHA ID
        </h1>

        <p class="subtitle" data-i18n="abhaLink.subtitle">
          Enter your 14-digit ABHA number to link it with PulseTag.
        </p>
      </header>

      <form id="abhaLinkForm" class="form" novalidate>
        <div class="field">
          <label for="abhaId" data-i18n="abhaLink.label">
            ABHA number
          </label>

          <input
            id="abhaId"
            name="abhaId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="14"
            placeholder="14-digit ABHA number"
            data-i18n-placeholder="abhaLink.placeholder"
            aria-describedby="abhaHint abhaMessage"
            required
          >

          <div id="abhaHint" class="hint" data-i18n="abhaLink.hint">
            Enter the 14-digit ABHA number associated with your account.
          </div>

          <div
            id="abhaMessage"
            class="message"
            role="alert"
            aria-live="polite"
          ></div>
        </div>

        <button
          id="verifyButton"
          class="button button-primary"
          type="submit"
        >
          <span data-i18n="abhaLink.verify">
            Verify & Link
          </span>
        </button>

        <button
          id="backButton"
          class="button button-secondary"
          type="button"
          data-i18n="abhaLink.back"
        >
          Back
        </button>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("abhaLinkForm");
    const abhaInput = document.getElementById("abhaId");
    const message = document.getElementById("abhaMessage");
    const verifyButton = document.getElementById("verifyButton");
    const backButton = document.getElementById("backButton");

    let verifying = false;

    function t(key, fallback) {
      try {
        if (
          typeof translations !== "undefined" &&
          typeof getState === "function"
        ) {
          const language = getState().language || "en";
          const value = translations[language]?.[key];

          if (value) {
            return value;
          }
        }
      } catch (error) {
        // Use fallback.
      }

      return fallback;
    }

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message visible ${type}`;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function setLoading(loading) {
      verifying = loading;
      verifyButton.disabled = loading;
      abhaInput.disabled = loading;

      if (loading) {
        verifyButton.innerHTML = `
          <span class="loading">
            <span class="spinner" aria-hidden="true"></span>
            <span>
              ${t("abhaLink.verifying", "Verifying...")}
            </span>
          </span>
        `;
      } else {
        verifyButton.innerHTML = `
          <span data-i18n="abhaLink.verify">
            ${t("abhaLink.verify", "Verify & Link")}
          </span>
        `;
      }
    }

    function verifyAbhaMock(enteredId) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (/^\d{14}$/.test(enteredId)) {
            resolve({ success: true });
          } else {
            reject(new Error("Invalid ABHA number"));
          }
        }, 1000);
      });
    }

    abhaInput.addEventListener("input", () => {
      abhaInput.value = abhaInput.value
        .replace(/\D/g, "")
        .slice(0, 14);

      clearMessage();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (verifying) {
        return;
      }

      clearMessage();

      const enteredId = abhaInput.value.trim();

      if (!/^\d{14}$/.test(enteredId)) {
        showMessage(
          t(
            "abhaLink.invalid",
            "Please enter a valid 14-digit ABHA number."
          )
        );

        abhaInput.focus();
        return;
      }

      setLoading(true);

      try {
        await verifyAbhaMock(enteredId);

        updateState({
          abha: {
            linked: true,
            id: enteredId
          }
        });

        window.location.href = "emergency-profile.html";
      } catch (error) {
        setLoading(false);

        showMessage(
          t(
            "abhaLink.error",
            "Unable to verify the ABHA number. Please try again."
          )
        );

        abhaInput.focus();
      }
    });

    backButton.addEventListener("click", () => {
      window.location.href = "abha-status.html";
    });

    try {
      const state = getState();

      if (state?.language) {
        setLanguage(state.language);
      }
    } catch (error) {
      // Keep default text if state/i18n is unavailable.
    }
  </script>
</body>
</html>
